<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarketHub | Catalog & Products</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <span>MarketHub</span>
        <span class="brand-badge">Catalog</span>
      </a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="products.html" style="font-weight: 700; color: var(--accent);">All Products</a>
      </div>
      <div class="nav-actions">
        <a href="cart.html" class="btn btn-secondary">🛒 Cart</a>
        <a href="login.html" class="btn btn-primary" id="authBtn">Sign In</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <div style="display: flex; gap: 32px; align-items: flex-start; flex-wrap: wrap;">
      
      <!-- Filter Sidebar -->
      <aside style="width: 260px; background: #fff; padding: 24px; border-radius: var(--radius-md); border: 1px solid var(--border); flex-shrink: 0;">
        <h3 style="font-size: 1.1rem; font-weight: 700; margin-bottom: 20px;">Filters</h3>
        
        <div class="form-group">
          <label class="form-label">Search</label>
          <input type="text" id="searchInput" class="form-input" placeholder="Keywords...">
        </div>

        <div class="form-group">
          <label class="form-label">Category</label>
          <select id="categorySelect" class="form-select">
            <option value="">All Categories</option>
            <option value="1">Electronics</option>
            <option value="2">Home & Living</option>
            <option value="3">Apparel & Fashion</option>
            <option value="4">Books & Media</option>
            <option value="5">Fitness & Wellness</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Sort By</label>
          <select id="sortSelect" class="form-select">
            <option value="newest">Newest Arrivals</option>
            <option value="price_asc">Price: Low to High</option>
            <option value="price_desc">Price: High to Low</option>
            <option value="rating">Customer Rating</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Price Range ($)</label>
          <div style="display: flex; gap: 8px;">
            <input type="number" id="minPriceInput" class="form-input" placeholder="Min" style="width: 50%;">
            <input type="number" id="maxPriceInput" class="form-input" placeholder="Max" style="width: 50%;">
          </div>
        </div>

        <button onclick="applyFilters()" class="btn btn-primary" style="width: 100%; margin-top: 8px;">Apply Filters</button>
        <button onclick="resetFilters()" class="btn btn-secondary" style="width: 100%; margin-top: 8px;">Reset</button>
      </aside>

      <!-- Products Listing -->
      <div style="flex: 1; min-width: 300px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <h1 style="font-size: 1.4rem; font-weight: 700;">Marketplace Catalog</h1>
          <span id="productTotalCount" style="font-size: 0.85rem; color: var(--text-muted);">Showing products</span>
        </div>

        <div class="product-grid" id="productsGrid">
          <!-- Populated via API -->
        </div>

        <!-- Pagination Controls -->
        <div id="paginationBar" style="display: flex; justify-content: center; gap: 8px; margin-top: 36px;">
        </div>
      </div>

    </div>
  </main>

  <script src="js/api.js"></script>
  <script>
    let currentPage = 1;

    async function loadProducts() {
      const search = document.getElementById('searchInput').value;
      const category = document.getElementById('categorySelect').value;
      const sort = document.getElementById('sortSelect').value;
      const minPrice = document.getElementById('minPriceInput').value;
      const maxPrice = document.getElementById('maxPriceInput').value;

      const params = { page: currentPage, limit: 9 };
      if (search) params.search = search;
      if (category) params.category = category;
      if (sort) params.sort = sort;
      if (minPrice) params.minPrice = minPrice;
      if (maxPrice) params.maxPrice = maxPrice;

      try {
        const res = await API.products.list(params);
        renderProducts(res.data || []);
        renderPagination(res.pagination);
      } catch (err) {
        showToast('Error loading products: ' + err.message, 'error');
      }
    }

    function renderProducts(products) {
      const grid = document.getElementById('productsGrid');
      if (!products || products.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1/-1; padding: 48px; text-align: center; color: var(--text-muted); background: #fff; border-radius: var(--radius-md); border: 1px solid var(--border);">No products match your filters.</div>';
        return;
      }

      grid.innerHTML = products.map(p => `
        <div class="product-card">
          <div class="product-img-wrap">
            <img src="${p.imageUrl}" alt="${p.name}">
          </div>
          <div class="product-info">
            <div class="product-meta">${p.categoryName || 'General'} · ★ ${p.rating ? p.rating.toFixed(1) : '5.0'} (${p.reviewCount})</div>
            <a href="product-details.html?id=${p.productId}" class="product-title">${p.name}</a>
            <div class="product-price-row">
              <span class="price-current">$${p.discountedPrice}</span>
              ${p.discountPercent > 0 ? `<span class="price-original">$${p.price}</span>` : ''}
            </div>
            <div style="font-size: 0.75rem; color: ${p.stockQuantity > 5 ? 'var(--success)' : 'var(--danger)'};">
              ${p.stockQuantity > 0 ? `In Stock (${p.stockQuantity})` : 'Out of Stock'}
            </div>
            <button onclick="addToCart(${p.productId})" class="btn btn-secondary" style="width: 100%; margin-top: 8px;">Add to Cart</button>
          </div>
        </div>
      `).join('');
    }

    function renderPagination(meta) {
      if (!meta) return;
      document.getElementById('productTotalCount').innerText = `Total ${meta.total} products (Page ${meta.page} of ${meta.totalPages || 1})`;
      const bar = document.getElementById('paginationBar');
      let html = '';
      if (meta.totalPages > 1) {
        for (let i = 1; i <= meta.totalPages; i++) {
          html += `<button onclick="goToPage(${i})" class="btn ${i === meta.page ? 'btn-primary' : 'btn-secondary'}" style="min-width: 40px;">${i}</button>`;
        }
      }
      bar.innerHTML = html;
    }

    function goToPage(p) {
      currentPage = p;
      loadProducts();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function applyFilters() {
      currentPage = 1;
      loadProducts();
    }

    function resetFilters() {
      document.getElementById('searchInput').value = '';
      document.getElementById('categorySelect').value = '';
      document.getElementById('minPriceInput').value = '';
      document.getElementById('maxPriceInput').value = '';
      document.getElementById('sortSelect').value = 'newest';
      currentPage = 1;
      loadProducts();
    }

    async function addToCart(id) {
      try {
        await API.cart.add(id, 1);
        showToast('Item added to cart!', 'success');
      } catch (err) {
        if (err.status === 401) {
          window.location.href = 'login.html';
        } else {
          showToast(err.message, 'error');
        }
      }
    }

    // Read initial URL params
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('category')) {
      document.getElementById('categorySelect').value = urlParams.get('category');
    }
    loadProducts();
  </script>
</body>
</html>
